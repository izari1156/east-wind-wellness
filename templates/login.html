{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
<section class="section">
  <div class="auth-card">
    <h1>Log In</h1>
    <p class="muted">New here? <a href="{{ url_for('register') }}">Create an account</a>.</p>
    <form method="POST" class="stacked-form">
      <label>Email
        <input type="email" name="email" required autofocus>
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>
    <div class="demo-hint">
      <p><strong>Demo accounts</strong> (for testing):</p>
      <p>Admin &mdash; admin@eastwindwellness.sg / admin123</p>
      <p>Customer &mdash; customer@example.com / customer123</p>
    </div>
  </div>
</section>
{% endblock %}
